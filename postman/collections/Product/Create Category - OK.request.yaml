$kind: http-request
url: http://localhost:8000/staff/products/create_category/
method: POST
body:
  type: json
  content: |-
    {
        "name": "{{$randomAlphaNumeric 12}}",
        "refresh": "{{refresh_token}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{access_token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Category creation - OK", function() {
          pm.response.to.have.status(201)
      })

      pm.environment.set('new_category_name', pm.response.json().category)
    language: text/javascript
order: 331113974084240

$kind: http-request
name: Register customer - OK
url: http://localhost:8000/users/register_customer/
method: POST
body:
  type: json
  content: |-
    {
        "username": "{{$randomUserName}}",
        "email": "{{$randomEmail}}",
        "password": "{{$randomPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Request should return 201", function () {
          pm.response.to.have.status(201);
      });

      const json = pm.response.json();

      pm.environment.set("access_token", json.access);
      pm.environment.set("refresh_token", json.refresh);
      pm.environment.set()

      pm.test("Access token exists", function () {
          pm.expect(pm.environment.get("access_token")).to.exist;
      });

      pm.test("Refresh token exists", function () {
          pm.expect(pm.environment.get("refresh_token")).to.exist;
      });

      console.log(pm.environment.get("access_token"));
      console.log(pm.environment.get("refresh_token"));
    language: text/javascript
order: 4149087115412767

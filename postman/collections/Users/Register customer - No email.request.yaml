$kind: http-request
name: Register customer - No email
url: http://localhost:8000/users/register_customer/
method: POST
body:
  type: json
  content: ""
scripts:
  - type: beforeRequest
    code: |-
      const loginRequest = {
          url: pm.environment.get("base_url") + "/users/register_customer/",
          method: "POST",
          header: { "Content-Type": "application/json" },
          body: {
              mode: "raw",
              raw: JSON.stringify({
                  username: pm.environment.get("username"),
                  password: pm.environment.get("password")
              })
          }
      };

      pm.sendRequest(loginRequest, function (err, response) {
          if (!!err) {
              console.log(err)
          } else {
              console.log("Unfeasible")
          }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Failed due to missing username parameter', function() {
          pm.response.to.have.status(400);
      })
    language: text/javascript
order: 1782221280883
